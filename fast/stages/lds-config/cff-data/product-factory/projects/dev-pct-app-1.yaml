# team or application-level project with automation resources
parent: product/development
# project prefix is forced via override in `main.tf`
name: dev-pct-app-1
labels:
  team: pct
  app: app-1
  environment: dev
iam:
  roles/owner:
    # refer to the rw service account defined below
    - rw
  roles/viewer:
    # refer to the ro service account defined below
    - ro
automation:
  # no context is possible here
  # use the complete project id
  project: lild-prod-iac-teams-1
  service_accounts:
    # resulting sa name: lild-dev-pct-app-1-rw
    rw:
      description: Read/write automation sa for product team app 1.
    # resulting sa name: lild-dev-pct-app-1-ro
    ro:
      description: Read-only automation sa for product team app 1.
  buckets:
    # resulting bucket name: lild-dev-pct-app-1-state
    state:
      description: Terraform state bucket for product team app 1.
      location: us
      iam:
        # service accounts can use short name substitutions from context
        roles/storage.objectCreator:
          - rw
        roles/storage.objectViewer:
          - rw
          - ro
          - group:gcp-devops@littledragonsoftware.com